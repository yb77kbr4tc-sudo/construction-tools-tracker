<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Construction Tools Tracker</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #1f7a8c;
      --primary-dark: #13596a;
      --accent: #f4a261;
      --success: #2a9d8f;
      --danger: #d9534f;
      --text: #1d2a39;
      --muted: #6b7a8f;
      --border: #dfe7ee;
      --shadow: 0 12px 26px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 16px;
    }

    .app {
      max-width: 1200px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .topbar h1 {
      margin: 0;
      font-size: clamp(1.4rem, 2vw, 2rem);
    }

    .pill {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 0.04em;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-value {
      font-size: clamp(1.6rem, 2vw, 2.3rem);
      font-weight: bold;
      color: var(--text);
    }

    .layout {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .panel h3 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.12rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    label {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: bold;
    }

    input, select, button {
      font: inherit;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      transition: all 0.2s ease;
      font-weight: bold;
    }

    .primary-btn {
      background: var(--primary);
      color: white;
    }

    .primary-btn:hover { background: var(--primary-dark); }

    .secondary-btn {
      background: #edf3f7;
      color: var(--text);
    }

    .secondary-btn:hover { background: #e2ebf3; }

    .danger-btn {
      background: #fee2e2;
      color: #991b1b;
    }

    .danger-btn:hover { background: #fecaca; }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .toolbar input {
      flex: 1;
      min-width: 180px;
    }

    .tools-list {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .tool-row {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      background: #fafbfd;
      display: grid;
      grid-template-columns: 1.4fr 0.7fr 0.8fr auto;
      gap: 12px;
      align-items: center;
    }

    .tool-name {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .tool-meta {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      width: fit-content;
    }

    .status-available {
      background: #dcfce7;
      color: #166534;
    }

    .status-checkedout {
      background: #fee2e2;
      color: #991b1b;
    }

    .history-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .history-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      background: #fbfdff;
    }

    .history-item strong {
      display: block;
      margin-bottom: 4px;
    }

    .small {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .muted {
      color: var(--muted);
    }

    @media (max-width: 820px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .tool-row {
        grid-template-columns: 1fr;
      }

      .grid-2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>Construction Tools Tracker</h1>
      <div class="pill">Field Ready</div>
    </header>

    <section class="stats" id="stats"></section>

    <div class="layout">
      <div class="panel">
        <h3>Add Tool</h3>
        <div class="field">
          <label for="toolName">Tool name</label>
          <input id="toolName" type="text" placeholder="e.g. Dewalt Angle Grinder" />
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="toolCategory">Category</label>
            <input id="toolCategory" type="text" placeholder="Power tools" />
          </div>
          <div class="field">
            <label for="toolSerial">Serial / Tag</label>
            <input id="toolSerial" type="text" placeholder="CW-1042" />
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="toolCondition">Condition</label>
            <select id="toolCondition">
              <option>Good</option>
              <option>Fair</option>
              <option>Poor</option>
              <option>Needs Repair</option>
            </select>
          </div>
          <div class="field">
            <label for="toolLocation">Location</label>
            <input id="toolLocation" type="text" placeholder="Warehouse / Site A" />
          </div>
        </div>

        <button class="primary-btn" id="addToolBtn" style="width: 100%;">Add Tool</button>
      </div>

      <div class="panel">
        <h3>Check In / Out</h3>

        <div class="field">
          <label for="checkoutTool">Tool</label>
          <select id="checkoutTool"></select>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="checkoutUser">Worker</label>
            <select id="checkoutUser"></select>
          </div>
          <div class="field">
            <label for="checkoutSite">Site</label>
            <select id="checkoutSite"></select>
          </div>
        </div>

        <div class="grid-2">
          <button class="primary-btn" id="checkoutBtn">Check Out</button>
          <button class="secondary-btn" id="checkinBtn">Check In</button>
        </div>

        <div class="field" style="margin-top: 14px;">
          <label for="checkoutNote">Notes</label>
          <input id="checkoutNote" type="text" placeholder="Notes for this checkout" />
        </div>
      </div>
    </div>

    <div class="panel">
      <h3>Tools Inventory</h3>
      <div class="toolbar">
        <input id="searchInput" type="text" placeholder="Search tools..." />
        <button class="secondary-btn" id="resetFilterBtn">Reset</button>
      </div>
      <div id="toolsList" class="tools-list"></div>
    </div>

    <div class="panel" style="margin-top: 20px;">
      <h3>Recent Activity</h3>
      <div id="historyList" class="history-list"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "construction_tools_tracker_v1";

    function makeId(prefix) {
      return prefix + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
    }

    const defaultState = {
      users: [
        { id: "u1", name: "Mike Johnson" },
        { id: "u2", name: "Luis Perez" },
        { id: "u3", name: "Ashley Brown" }
      ],
      sites: [
        { id: "s1", name: "North Tower" },
        { id: "s2", name: "West Apartments" },
        { id: "s3", name: "Warehouse" }
      ],
      tools: [
        {
          id: "t1",
          name: "DeWalt Drill Driver",
          category: "Power Tools",
          serial: "DW-1001",
          condition: "Good",
          location: "Warehouse",
          status: "available",
          assignedTo: "",
          siteId: "",
          lastCheckedOut: ""
        },
        {
          id: "t2",
          name: "Bosch Circular Saw",
          category: "Cutting Tools",
          serial: "BS-2241",
          condition: "Fair",
          location: "Site A",
          status: "checked_out",
          assignedTo: "u1",
          siteId: "s1",
          lastCheckedOut: new Date().toISOString()
        },
        {
          id: "t3",
          name: "Masonry Hammer",
          category: "Hand Tools",
          serial: "MH-3010",
          condition: "Good",
          location: "Warehouse",
          status: "available",
          assignedTo: "",
          siteId: "",
          lastCheckedOut: ""
        }
      ],
      activity: [
        {
          id: "a1",
          type: "checkout",
          toolName: "Bosch Circular Saw",
          workerName: "Mike Johnson",
          siteName: "North Tower",
          note: "Used for framing",
          timestamp: new Date(Date.now() - 1000 * 60 * 60 * 5).toISOString()
        }
      ]
    };

    let state = loadState();

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return structuredClone(defaultState);

      try {
        const parsed = JSON.parse(saved);
        return parsed;
      } catch (error) {
        return structuredClone(defaultState);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function renderStats() {
      const stats = document.getElementById("stats");
      const total = state.tools.length;
      const available = state.tools.filter(t => t.status === "available").length;
      const checkedOut = total - available;

      stats.innerHTML = `
        <div class="stat-card">
          <div class="stat-label">Total Tools</div>
          <div class="stat-value">${total}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Available</div>
          <div class="stat-value">${available}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Checked Out</div>
          <div class="stat-value">${checkedOut}</div>
        </div>
      `;
    }

    function renderSelects() {
      const checkoutTool = document.getElementById("checkoutTool");
      const checkoutUser = document.getElementById("checkoutUser");
      const checkoutSite = document.getElementById("checkoutSite");

      checkoutTool.innerHTML = state.tools.map(tool => `
        <option value="${tool.id}">${tool.name} (${tool.status === "available" ? "Available" : "Checked Out"})</option>
      `).join("");

      checkoutUser.innerHTML = state.users.map(user => `
        <option value="${user.id}">${user.name}</option>
      `).join("");

      checkoutSite.innerHTML = state.sites.map(site => `
        <option value="${site.id}">${site.name}</option>
      `).join("");
    }

    function renderTools() {
      const searchInput = document.getElementById("searchInput").value.trim().toLowerCase();
      const toolsList = document.getElementById("toolsList");

      const filtered = state.tools.filter(tool => {
        if (!searchInput) return true;
        return (
          tool.name.toLowerCase().includes(searchInput) ||
          tool.category.toLowerCase().includes(searchInput) ||
          tool.serial.toLowerCase().includes(searchInput) ||
          tool.location.toLowerCase().includes(searchInput)
        );
      });

      if (!filtered.length) {
        toolsList.innerHTML = `<div class="muted">No tools match your search.</div>`;
        return;
      }

      toolsList.innerHTML = filtered.map(tool => {
        const user = state.users.find(u => u.id === tool.assignedTo);
        const site = state.sites.find(s => s.id === tool.siteId);

        return `
          <div class="tool-row">
            <div>
              <div class="tool-name">${tool.name}</div>
              <div class="tool-meta">${tool.category} • Serial: ${tool.serial} • Condition: ${tool.condition}</div>
              <div class="tool-meta">Location: ${tool.location}</div>
            </div>

            <div>
              <span class="status-badge ${tool.status === 'available' ? 'status-available' : 'status-checkedout'}">
                ${tool.status === 'available' ? 'Available' : 'Checked Out'}
              </span>
            </div>

            <div class="tool-meta">
              ${user ? `Worker: ${user.name}` : "No worker assigned"}<br>
              ${site ? `Site: ${site.name}` : "No site assigned"}
            </div>

            <div>
              <button
                class="primary-btn"
                data-action="${tool.status === 'available' ? 'quick-out' : 'quick-in'}"
                data-id="${tool.id}"
                style="min-width: 120px;"
              >
                ${tool.status === 'available' ? 'Check Out' : 'Check In'}
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderHistory() {
      const historyList = document.getElementById("historyList");
      const items = [...state.activity].reverse();

      if (!items.length) {
        historyList.innerHTML = `<div class="muted">No recent activity.</div>`;
        return;
      }

      historyList.innerHTML = items.map(item => `
        <div class="history-item">
          <strong>${item.type === "checkout" ? "Checked Out" : "Checked In"} • ${item.toolName}</strong>
          <div class="small">${item.workerName} • ${item.siteName}</div>
          <div class="small">${item.note || "No note provided"}</div>
          <div class="small">${new Date(item.timestamp).toLocaleString()}</div>
        </div>
      `).join("");
    }

    function refreshView() {
      renderStats();
      renderSelects();
      renderTools();
      renderHistory();
    }

    function addTool() {
      const name = document.getElementById("toolName").value.trim();
      const category = document.getElementById("toolCategory").value.trim();
      const serial = document.getElementById("toolSerial").value.trim();
      const condition = document.getElementById("toolCondition").value;
      const location = document.getElementById("toolLocation").value.trim();

      if (!name || !category || !serial) {
        alert("Please enter tool name, category, and serial/tag.");
        return;
      }

      state.tools.push({
        id: makeId("t"),
        name,
        category,
        serial,
        condition,
        location: location || "Warehouse",
        status: "available",
        assignedTo: "",
        siteId: "",
        lastCheckedOut: ""
      });

      saveState();
      refreshView();

      document.getElementById("toolName").value = "";
      document.getElementById("toolCategory").value = "";
      document.getElementById("toolSerial").value = "";
      document.getElementById("toolLocation").value = "";
    }

    function checkOutTool(toolId, userId, siteId, note) {
      const tool = state.tools.find(t => t.id === toolId);
      if (!tool) return;

      if (tool.status === "checked_out") {
        alert("This tool is already checked out.");
        return;
      }

      const user = state.users.find(u => u.id === userId);
      const site = state.sites.find(s => s.id === siteId);

      tool.status = "checked_out";
      tool.assignedTo = userId;
      tool.siteId = siteId;
      tool.location = site ? site.name : tool.location;
      tool.lastCheckedOut = new Date().toISOString();

      state.activity.push({
        id: makeId("a"),
        type: "checkout",
        toolName: tool.name,
        workerName: user ? user.name : "Unknown worker",
        siteName: site ? site.name : "Unknown site",
        note: note || "No note provided",
        timestamp: new Date().toISOString()
      });

      saveState();
      refreshView();
    }

    function checkInTool(toolId, note) {
      const tool = state.tools.find(t => t.id === toolId);
      if (!tool) return;

      if (tool.status === "available") {
        alert("This tool is already available.");
        return;
      }

      const user = state.users.find(u => u.id === tool.assignedTo);
      const site = state.sites.find(s => s.id === tool.siteId);

      tool.status = "available";
      tool.assignedTo = "";
      tool.siteId = "";
      tool.location = tool.location || "Warehouse";

      state.activity.push({
        id: makeId("a"),
        type: "checkin",
        toolName: tool.name,
        workerName: user ? user.name : "Unknown worker",
        siteName: site ? site.name : "Unknown site",
        note: note || "Returned to warehouse",
        timestamp: new Date().toISOString()
      });

      saveState();
      refreshView();
    }

    document.getElementById("addToolBtn").addEventListener("click", addTool);

    document.getElementById("checkoutBtn").addEventListener("click", () => {
      const toolId = document.getElementById("checkoutTool").value;
      const userId = document.getElementById("checkoutUser").value;
      const siteId = document.getElementById("checkoutSite").value;
      const note = document.getElementById("checkoutNote").value.trim();

      checkOutTool(toolId, userId, siteId, note);
      document.getElementById("checkoutNote").value = "";
    });

    document.getElementById("checkinBtn").addEventListener("click", () => {
      const toolId = document.getElementById("checkoutTool").value;
      const note = document.getElementById("checkoutNote").value.trim();

      checkInTool(toolId, note);
      document.getElementById("checkoutNote").value = "";
    });

    document.getElementById("searchInput").addEventListener("input", renderTools);

    document.getElementById("resetFilterBtn").addEventListener("click", () => {
      document.getElementById("searchInput").value = "";
      renderTools();
    });

    document.getElementById("toolsList").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const action = button.dataset.action;
      const id = button.dataset.id;

      if (!id) return;

      const tool = state.tools.find(t => t.id === id);
      if (!tool) return;

      if (action === "quick-out") {
        const userId = state.users[0]?.id;
        const siteId = state.sites[0]?.id;
        if (userId && siteId) {
          checkOutTool(id, userId, siteId, "Quick checkout from inventory");
        }
      }

      if (action === "quick-in") {
        checkInTool(id, "Quick return");
      }
    });

    refreshView();
  </script>
</body>
</html>
